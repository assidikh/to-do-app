<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>To Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>📝 Just Dot It</h1>

    <!-- Formulaire -->
    <form id="taskForm">
        <input type="text" id="taskInput" placeholder="Entrez une tâche">
        <button type="submit">Ajouter</button>
    </form>

    <!-- Message d'erreur -->
    <p id="errorMessage"></p>

    <!-- Liste des tâches -->
    <ul id="taskList"></ul>

    <script src="script.js"></script>
</body>
</html>
